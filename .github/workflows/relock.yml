name: relock

# Temporary one-shot workflow: regenerate poetry.lock on a runner with public
# PyPI access (local dev is behind a mirror that blocks pypi.org) and publish it
# as an artifact to download and commit. Removed before this branch's PR opens.
on:
  push:
    branches: [ chore/bump-dev-deps ]

jobs:
  relock:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install poetry
        run: pipx install poetry
      - name: Regenerate lock
        run: poetry lock
      - name: Verify lock matches pyproject
        run: poetry check --lock
      - name: Upload poetry.lock
        uses: actions/upload-artifact@v4
        with:
          name: poetry-lock
          path: poetry.lock
          if-no-files-found: error
